<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - HydroControl</title>
    <link rel="stylesheet" href="style.css">
    <script src="paho-mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>⚙️ Configuraciones</h1>
            <a href="index.html" class="header-link">← Volver</a>
        </div>

        <div class="section-block">
            <div class="card">
                <h2>👤 Acceso de tu placa</h2>
                <label>ID de la placa (para otra red): <input type="text" id="deviceId" placeholder="esp8266-xxxxxx"></label>
                <label>Usuario de la placa: <input type="text" id="appUser" placeholder="usuario"></label>
                <label>Contraseña de la placa: <input type="password" id="appPassword" placeholder="contraseña"></label>
                <button id="loginBoard">Vincular esta web con mi placa</button>
                <p id="authStatus">Sin autenticar</p>
                <p>ID de placa: <strong id="deviceIdDisplay">--</strong></p>
                <p id="connStatus">Sin conexión</p>
            </div>
                <div class="card">
                    <h2 id="settingsCardTitle">⚙️ Ajustes</h2>
                    <div class="row">
                        <label id="manualClockLabel">Hora del ESP8266:
                            <input type="time" id="manualClockTime" step="1">
                        </label>
                        <label id="languageLabel">Idioma:
                            <select id="languageSelect">
                                <option value="es">Español</option>
                                <option value="en">English</option>
                            </select>
                        </label>
                    </div>
                    <div class="row">
                        <button id="saveSettings">Guardar ajustes</button>
                    </div>
                    <p class="settings-note" id="settingsNote">Escribe la hora actual y el ESP8266 la guardará para su reloj interno.</p>
                </div>
        </div>

    </div>

    <script src="autoLogic.js?v=20260807-3"></script>
    <script src="script.js?v=20260807-3"></script>
</body>
</html>
