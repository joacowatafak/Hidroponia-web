<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - HydroControl</title>
    <link rel="stylesheet" href="style.css">
    <script src="paho-mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>⚙️ Configuraciones</h1>
            <a href="index.html" class="header-link">← Volver</a>
        </div>

        <div class="section-block">
            <div class="card">
                <h2>👤 Acceso de tu placa</h2>
                <label>IP de la placa (manual): <input type="text" id="espIp" placeholder="192.168.1.50"></label>
                <label>Usuario de la placa: <input type="text" id="appUser" placeholder="usuario"></label>
                <label>Contraseña de la placa: <input type="password" id="appPassword" placeholder="contraseña"></label>
                <button id="loginBoard">Vincular esta web con mi placa</button>
                <button id="saveSettings">Guardar IP</button>
                <p id="authStatus">Sin autenticar</p>
                <p>ID de placa: <strong id="deviceIdDisplay">--</strong></p>
                <p id="connStatus">Sin conexión</p>
            </div>
        </div>
    </div>

    <script src="autoLogic.js"></script>
    <script src="script.js"></script>
</body>
</html>
